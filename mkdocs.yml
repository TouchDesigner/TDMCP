# Documentation site for TDMCP.
#
# Content is plain Markdown under docs/. This file only decides what the site
# is called, how it looks, and the order pages appear in the nav.
#
# Local preview:  pip install -r docs/requirements.txt && mkdocs serve
# Published by:   .github/workflows/docs.yml, on every push to main.

site_name: TouchDesigner MCP
site_url: https://touchdesigner.github.io/TDMCP/
site_description: An MCP server that runs inside TouchDesigner, so an AI coding agent can collaborate with you in a TouchDesigner environment.
site_author: Derivative
copyright: Copyright &copy; 2026 Derivative Inc.

repo_url: https://github.com/TouchDesigner/TDMCP
repo_name: TouchDesigner/TDMCP
edit_uri: edit/main/docs/

theme:
  name: material
  icon:
    logo: material/graph-outline
    repo: fontawesome/brands/github
  palette:
    # Follow the reader's system setting by default, with a manual override.
    # Colours themselves live in docs/stylesheets/extra.css: a white header,
    # a sky-blue accent, and a darkened text variant of it for the light scheme.
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: light blue
      toggle:
        icon: material/weather-night
        name: Switch to system preference
  # Body and code match derivative.ca. Headings take T-Star Pro via extra.css.
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.instant       # no full reload between pages
    - navigation.instant.progress
    - navigation.tracking      # URL follows the anchor you are reading
    - navigation.tabs          # top-level sections as tabs
    - navigation.top           # back-to-top button
    - navigation.footer        # previous / next links
    - toc.follow               # right-hand TOC tracks the scroll position
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.action.edit
    - content.tabs.link

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Link to this section
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  # Lets docs/changelog.md and docs/license.md include the canonical files at
  # the repo root, so there is exactly one copy of each.
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

plugins:
  - search

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/TouchDesigner/TDMCP
      name: TDMCP on GitHub
    - icon: material/school-outline
      link: https://derivative.ca
      name: Derivative

nav:
  # index.md stays top level so MkDocs recognises it as the home page.
  - index.md
  - Getting started:
      - quick-start.md
      - what-you-get.md
  - Component:
      - parameters.md
      - skills.md
      - security.md
  - Setup:
      - setup-advanced.md
      - troubleshooting.md
  - Project:
      - changelog.md
      - license.md
